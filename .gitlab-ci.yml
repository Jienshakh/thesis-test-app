stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-image:
  stage: build

  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker
      command:
        - "--tls=false"
        - "--insecure-registry=registry.81.26.191.148.nip.io"

  tags:
    - release

  before_script:
    - docker info
    - docker login registry.81.26.191.148.nip.io \
        -u "$CI_REGISTRY_USER" \
        -p "$CI_REGISTRY_PASSWORD"

  script:
    - docker build -t registry.81.26.191.148.nip.io/root/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA .

    - docker push registry.81.26.191.148.nip.io/root/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag \
          registry.81.26.191.148.nip.io/root/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA \
          registry.81.26.191.148.nip.io/root/$CI_PROJECT_NAME:latest

        docker push registry.81.26.191.148.nip.io/root/$CI_PROJECT_NAME:latest
      fi