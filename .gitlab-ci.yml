stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""

  REGISTRY: registry.103.76.54.202.nip.io
  IMAGE_NAME: $REGISTRY/netology/test-app

build-image:
  stage: build

  image: docker:27

  services:
    - name: docker:27-dind
      command:
        - "--host=tcp://0.0.0.0:2375"
        - "--tls=false"
        - "--insecure-registry=registry.103.76.54.202.nip.io"

  tags:
    - release

  before_script:
    - until docker info; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login $REGISTRY -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG=$CI_COMMIT_TAG
      else
        TAG=$CI_COMMIT_SHORT_SHA
      fi

    - echo "Building image $IMAGE_NAME:$TAG"

    - docker build -t $IMAGE_NAME:$TAG .

    - docker push $IMAGE_NAME:$TAG

    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "master" ]; then
        docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest
        docker push $IMAGE_NAME:latest
      fi

deploy-k8s:
  stage: deploy

  image: dtzar/helm-kubectl

  script:
    
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG=$CI_COMMIT_TAG
      else
        TAG=$CI_COMMIT_SHORT_SHA
      fi
    - echo "Deploying $TAG"
    - |
      helm upgrade --install test-app ./helm/ \
        --namespace default \
        --set image.repository=$IMAGE_NAME \
        --set image.tag=$TAG \
        --set ingress.host=test-app.103.76.54.202.nip.io

  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never
